<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipe Denah Interaktif Ridafarm</title>
    <!-- CSS terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="rida-denah-wrapper">
  <div style="margin-bottom: 1rem; text-align: center;">
      <h2 style="margin-bottom: 0.5rem;">Prototipe Interaktif: Denah Ridafarm</h2>
      <p style="color: #666; font-size: 14px; margin-top: 0;">Klik area bangunan untuk memindahkan karakter dan melihat opsi.</p>
  </div>
  
  <div id="rida-denah-container">
    <!-- Gambar latar (Denah) -->
    <img id="rida-denah-bg" src="denah-ridafarm.webp" alt="Denah Ridafarm" />

    <!-- Layer hotspot yang sudah diperbaiki letaknya berdasarkan visual map -->
    <div id="rida-denah-hotspot-layer">
      <!-- Kandang Kambing (Kiri) -->
      <div class="rida-denah-hotspot" data-id="kandang-kiri" title="Kandang Kambing (Kiri)"
           style="top: 18%; left: 20%; width: 16%; height: 23%;"></div>
      
      <!-- Kandang Kambing (Kanan) -->
      <div class="rida-denah-hotspot" data-id="kandang-kanan" title="Kandang Kambing (Kanan)"
           style="top: 18%; left: 62%; width: 22%; height: 23%;"></div>
      
      <!-- Papan Pengumuman (Tengah) -->
      <div class="rida-denah-hotspot" data-id="papan-pengumuman" title="Papan Pengumuman"
           style="top: 43%; left: 41%; width: 17%; height: 18%;"></div>
      
      <!-- Bale Bengong (Gazebo Kiri Bawah) -->
      <div class="rida-denah-hotspot" data-id="bale-bengong" title="Bale Bengong"
           style="top: 48%; left: 12%; width: 14%; height: 30%;"></div>
           
      <!-- Picnic Ground (Papan Nama) -->
      <div class="rida-denah-hotspot" data-id="picnic-ground" title="Picnic Ground"
           style="top: 17%; left: 43%; width: 14%; height: 6%;"></div>
           
      <!-- Sungai (Papan Nama) -->
      <div class="rida-denah-hotspot" data-id="sungai" title="Sungai"
           style="top: 4%; left: 44%; width: 12%; height: 7%;"></div>
    </div>

    <!-- Karakter -->
    <img id="rida-denah-character" src="pak-wayan-artana.svg" alt="Pak Wayan Artana" />

    <!-- Kotak Popup Interaktif dengan Beberapa Opsi -->
    <div id="rida-denah-action-popup">
        <div id="rida-denah-popup-header" class="rida-denah-popup-header">Nama Bangunan</div>
        <div id="rida-denah-popup-body" class="rida-denah-popup-body">
            <!-- Tombol-tombol opsi akan di-inject ke sini oleh JS -->
        </div>
    </div>
  </div>
</div>

<!-- JS terpisah -->
<script src="script.js"></script>

</body>
</html>
